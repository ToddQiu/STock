name: Windows installer release
# Initialize native calendar libraries before starting concurrent monitor threads.
on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      TZ: Asia/Shanghai
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install '.[translation]' pyinstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix translation_runtime ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix .qa-runtime --no-save playwright
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare_hosted_translation.py --root .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Regression checks
        run: |
          python -m unittest discover -s tests -p 'test_empty_watchlist.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_portfolio*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_remaining_cash.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/test_desktop_workbench.cjs tests/test_startup_memory.cjs tests/test_portfolio_cash.cjs tests/test_portfolio_currency.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build empty-profile application
        run: |
          python scripts/build_desktop_package.py --node (Get-Command node).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify application before compression
        run: |
          $env:NODE_PATH = "$PWD/.qa-runtime/node_modules"
          $payload = Get-ChildItem dist -Directory | Select-Object -First 1
          node tests/check_portable_package.cjs $payload.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer
        run: |
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler missing' }
          $payload = Get-ChildItem dist -Directory | Select-Object -First 1
          python scripts/build_desktop_package.py --folder $payload.FullName --installer $compiler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, launch and uninstall in isolation
        run: |
          $setup = Get-ChildItem dist/*-x64.exe | Select-Object -First 1
          python tests/check_desktop_installer.py $setup.FullName --node (Get-Command node).Source --node-modules "$PWD/.qa-runtime/node_modules"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $name = "STock-Setup-$version-x64.exe"
          $setup = Get-ChildItem dist/*-x64.exe | Select-Object -First 1
          Copy-Item -LiteralPath $setup.FullName -Destination "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii
          @"
          ## 下载与安装
          Windows 10/11 64 位用户请下载 **$name**，双击安装。无需另外安装 Python 或 Node.js。

          - 默认持仓、账户余额与监测列表为空，不包含个人数据库、密钥或研究记录。
          - 内置英译中模型；行情和新闻需要联网，AI 分析需自行配置 API 凭据。
          - 本版本未作商业代码签名，Windows 可能显示未知发布者。
          - 安装、首次启动、离线翻译、数据保留及卸载检查均由 Windows 构建任务验证。
          - Source code (zip/tar.gz) 为源码，普通用户请选择上面的 exe 文件。

          SHA-256: $hash
          "@ | Set-Content .qa-runtime/release-notes.md -Encoding utf8
          gh release create $tag "dist/$name" "dist/$name.sha256" --target $env:GITHUB_SHA --title "STock $version · Windows 安装版" --notes-file .qa-runtime/release-notes.md --draft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
